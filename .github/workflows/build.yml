name: Build Mob

on:
  push:
    branches: master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            ext: ps1
          - os: ubuntu-24.04
            ext: sh

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install GCC 15
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y --no-install-recommends gcc-15 g++-15

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-15 100

      - name: Build Mob
        run: ./bootstrap.${{ matrix.ext }} -Verbose
