name: Build Mob

on:
  push:
    branches: master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            ext: ps1
          - os: ubuntu-24.04
            ext: sh

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Mob
        run: ./bootstrap.${{ matrix.ext }} -Verbose
